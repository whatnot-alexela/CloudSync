name: yandexdl-windows

# Собирает YandexDL Desktop (папка yandexdl/) в exe под Windows и выкладывает zip в Artifacts
# этого запуска. После упаковки — проверка: собранный exe запускается, поднимает локальный
# сервер и окно (обход папок опрашивает сервер), страница статуса отдаёт вкладку «Файлы».
#
# Запуск: вручную (Actions -> yandexdl-windows -> Run workflow) или пушем изменений в yandexdl/.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "yandexdl/**"
      - ".github/workflows/yandexdl-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yandexdl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ffmpeg кладём в vendor/ — yandexdl.spec забандлит его (нужен для видео)
      - name: Скачать ffmpeg
        id: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Положить ffmpeg в vendor/
        shell: bash
        run: |
          mkdir -p vendor/ffmpeg/win32
          cp "${{ steps.ffmpeg.outputs.ffmpeg-path }}/ffmpeg.exe" vendor/ffmpeg/win32/ffmpeg.exe

      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Сборка (PyInstaller)
        run: pyinstaller yandexdl.spec

      - name: Запаковать
        shell: bash
        run: |
          cd dist
          7z a -r ../YandexDLDesktop-windows.zip YandexDLDesktop
          cd ..
          du -sh dist/YandexDLDesktop YandexDLDesktop-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: YandexDLDesktop-windows
          path: yandexdl/YandexDLDesktop-windows.zip
          retention-days: 90
          compression-level: 0   # уже zip

      - name: Проверка запуска exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\YandexDLDesktop\YandexDLDesktop.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try {
              $crawl = Invoke-RestMethod -Uri "http://127.0.0.1:8001/api/fl/crawl" -TimeoutSec 3
              if ($crawl.agent) { $ok = $true; break }
            } catch {}
          }
          if ($ok) {
            $page = (Invoke-WebRequest -Uri "http://127.0.0.1:8001/status" -UseBasicParsing).Content
            if ($page -notmatch 'id="tabFiles"') { $ok = $false; Write-Host "на странице статуса нет вкладки «Файлы»" }
            Invoke-RestMethod -Uri "http://127.0.0.1:8001/api/fl/status" | ConvertTo-Json -Depth 3 | Write-Host
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          else { Write-Host "exe завершился сам, код $($p.ExitCode)" }
          if (-not $ok) { throw "собранный exe не поднял сервер и окно за 2 минуты" }
          Write-Host "exe запустился: сервер отвечает, окно опрашивает обход папок"
